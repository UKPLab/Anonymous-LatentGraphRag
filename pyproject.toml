[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "latentgraphrag"
version = "0.2.0"
description = "LatentGraphRAG: composing constructed knowledge at test time with Recursive Dense Retrieval."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["retrieval", "rag", "multi-hop", "dense-retrieval", "recursive-retrieval", "knowledge-graph", "react"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Recursive Dense Retrieval (RDR) supplies the encoder, the recursive search and the readout.
# Install it from its anonymous repository first (see README).
dependencies = [
    "recursive-dense-retrieval>=0.1",
    "numpy>=1.22",
    "torch>=2.1",
    "tqdm",
]

[project.optional-dependencies]
# HippoRAG's OpenIE for extracting triples (latentgraphrag.construction.triples.extract_with_hipporag).
# PropRAG is used from a checkout (propositions.extract_with_proprag) and is not installed from here.
construction = ["hipporag>=2.0.0a4"]
agent = ["openai>=1.40", "transformers>=4.51"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["latentgraphrag"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
